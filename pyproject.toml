[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-controller"
version = "1.0.0"
description = "NYC subway arrival board for a 128x32 RGB LED matrix on a Raspberry Pi, with a pixel-accurate terminal simulator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
hardware = [
    "rgbmatrix @ git+https://github.com/hzeller/rpi-rgb-led-matrix.git#subdirectory=bindings/python",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pillow>=10",
]

[project.scripts]
matrix-controller = "matrix_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["matrix_controller"]

[[tool.mypy.overrides]]
module = "rgbmatrix.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
